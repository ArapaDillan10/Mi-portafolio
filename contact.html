<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Dillan Arapa - Desarrollador Web Full-Stack</title>
    <meta name="description" content="Formulario de contacto de Dillan Arapa, desarrollador web full-stack y barbero.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-contacto">

    <header class="header header-contacto">
        <nav class="navegacion-contacto" aria-label="Navegación de contacto">
            <a href="index.html#contacto" class="btn-volver">← Volver al Inicio</a>
        </nav>
    </header>

    <main class="main-contacto">
        <section>
            <h1>Contacto</h1>
            <form action="#" method="POST">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Tu nombre">

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">

                <label for="tel">Teléfono:</label>
                <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" placeholder="387...">

                <label for="opciones">¿Qué necesitás?</label>
                <select id="opciones" name="opciones">
                    <option value="barberia">Turno Barbería</option>
                    <option value="programacion">Consulta sobre Programación</option>
                    <option value="otros">Otros</option>
                </select>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" required minlength="10" placeholder="Escribí al menos 10 letras..."></textarea>

                <div class="form-acciones">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos</label>
                </div>

                <button type="submit" class="btn-enviar">Enviar mensaje</button>
            </form>
        </section>
    </main>

</body>
</html>
